<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ember Wing — Synthwave Arcade Shmup</title>
  <style>
    @font-face { font-family: 'Monoton'; src: url('assets/fonts/Monoton-Regular.ttf') format('truetype'); font-display: swap; }
    @font-face { font-family: 'Orbitron'; src: url('assets/fonts/Orbitron-VariableFont.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05020a;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      aspect-ratio: 16 / 9;
      margin: auto;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #080312;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
